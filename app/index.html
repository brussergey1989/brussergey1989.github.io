<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- width=1300: приложение внутри iframe свёрстано под десктоп; на телефоне
       страница открывается отдалённой и свободно зумится двумя пальцами -->
  <meta name="viewport" content="width=1300">
  <title>Фитнес-директор</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #07080f;
      color: #e4e8f5;
      height: 100vh;
      height: 100dvh; /* мобильные: реальная видимая высота с учётом панели браузера */
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
    }

    /* Режим авторазмера: приложение сообщает свою высоту через postMessage,
       iframe растягивается под контент, скроллит сама страница (нативно) */
    body.autosize { overflow: auto; height: auto; }
    body.autosize iframe { height: auto; }

    /* Экран загрузки */
    #loader {
      position: fixed;
      inset: 0;
      background: #07080f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      transition: opacity .4s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-logo {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .loader-logo em { color: #818cf8; font-style: normal; }
    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(129,140,248,.2);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 13px; color: #3d4460; }

    /* Экран ошибки */
    #error {
      display: none;
      position: fixed;
      inset: 0;
      background: #07080f;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }
    #error.visible { display: flex; }
    .error-title {
      font-size: 20px;
      font-weight: 600;
      color: #e4e8f5;
    }
    .error-sub {
      font-size: 14px;
      color: #3d4460;
      max-width: 400px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Загрузочный экран -->
  <div id="loader">
    <div class="loader-logo">ФИТНЕС<em>·ДИРЕКТОР</em></div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Загрузка системы...</div>
  </div>

  <!-- Экран ошибки -->
  <div id="error">
    <div class="loader-logo">ФИТНЕС<em>·ДИРЕКТОР</em></div>
    <div class="error-title">Неверная ссылка</div>
    <div class="error-sub">
      Пожалуйста, используйте ссылку которую вам предоставил администратор системы.
    </div>
  </div>

  <!-- Iframe -->
  <iframe id="app" style="display:none;" allowfullscreen></iframe>

  <script>
    // ─── КОНФИГ КЛУБОВ ───────────────────────────────────────────
    // Добавляйте новых клиентов сюда:
    // 'ключ': 'ссылка на Apps Script веб-приложение'
    const CLUBS = {
      'demo': 'https://script.google.com/macros/s/AKfycbxyGkj3FMt6Y_iKewcDEBbUB46K2aIXIxSrSXpqSmOWz37XH401OpQ8n2vAkpwiQnc/exec',

      // Новые клубы добавляются так:
      // 'xfit':      'https://script.google.com/macros/s/XXXXXX/exec',
      // 'sportlife': 'https://script.google.com/macros/s/YYYYYY/exec',
      // 'olimp':     'https://script.google.com/macros/s/ZZZZZZ/exec',
    };
    // ─────────────────────────────────────────────────────────────

    const params = new URLSearchParams(window.location.search);
    const clubKey = params.get('club');
    const appUrl = CLUBS[clubKey];

    const loader = document.getElementById('loader');
    const error  = document.getElementById('error');
    const iframe = document.getElementById('app');

    if (!appUrl) {
      // Неизвестный клуб — показываем ошибку
      loader.classList.add('hidden');
      error.classList.add('visible');
    } else {
      // Загружаем нужный клуб
      iframe.src = appUrl;
      iframe.style.display = 'block';

      // Скрываем лоадер когда iframe загрузился
      iframe.addEventListener('load', () => {
        loader.classList.add('hidden');
      });

      // Фолбэк — скрыть лоадер через 5 сек если событие не сработало
      setTimeout(() => loader.classList.add('hidden'), 5000);
    }

    // ─── АВТОРАЗМЕР IFRAME ───────────────────────────────────────
    // Приложение внутри iframe может сообщать свою высоту:
    //   setInterval(function(){
    //     window.top.postMessage({ fdHeight: document.documentElement.scrollHeight }, '*');
    //   }, 600);
    // Тогда iframe растягивается под контент и страница скроллится нативно.
    window.addEventListener('message', (e) => {
      const h = e.data && e.data.fdHeight;
      if (typeof h === 'number' && h > 200 && h < 50000) {
        document.body.classList.add('autosize');
        iframe.style.height = h + 'px';
      }
    });
  </script>

</body>
</html>
